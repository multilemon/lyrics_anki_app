<!DOCTYPE html><html><head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Master Japanese vocabulary and grammar through your favorite songs. Export to Anki instantly.">



    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="HanaUta">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <title>HanaUta: Learn Japanese with Lyrics</title>
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts Preload to prevent FOUT/Tofu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <!-- Required for youtube_player_iframe in production -->
    <!-- CSS Skeleton for Startup -->
    <style>
      body {
        margin: 0;
        background-color: #0D1B2A; /* AppColors.background */
        font-family: 'Noto Sans', sans-serif;
      }
      .skeleton-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 60px;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      .skeleton-header {
        width: 100%;
        max-width: 800px;
        padding: 0 24px;
        margin-bottom: 32px;
        box-sizing: border-box;
      }
      .skeleton-title {
        height: 60px;
        width: 200px;
        background-color: #E8A87C; /* AppColors.sakura */
        border-radius: 12px;
        margin-bottom: 12px;
        opacity: 0.8;
      }
      .skeleton-subtitle {
        height: 24px;
        width: 300px;
        background-color: #8B9EC7; /* AppColors.textSecondary */
        border-radius: 8px;
        opacity: 0.5;
      }
      .skeleton-card-container {
        width: 100%;
        max-width: 800px;
        padding: 0 24px;
        box-sizing: border-box;
      }
      .skeleton-card {
        background-color: #1B2838; /* AppColors.surface */
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        border: 1px solid #2E4259; /* AppColors.border */
      }
      .skeleton-card-title {
        height: 32px;
        width: 180px;
        background-color: #E8E4DF; /* AppColors.textPrimary */
        border-radius: 8px;
        margin-bottom: 24px;
        opacity: 0.7;
      }
      .skeleton-input {
        height: 56px;
        width: 100%;
        background-color: #243447; /* AppColors.surfaceLight */
        border-radius: 16px;
        margin-bottom: 16px;
        border: 1px solid #2E4259; /* AppColors.border */
        box-sizing: border-box;
      }
      .skeleton-btn {
        height: 52px;
        width: 140px;
        background-color: #D4935A; /* AppColors.sakuraDark */
        border-radius: 16px;
        margin-top: 16px;
        opacity: 0.9;
      }
      @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 0.8; }
        100% { opacity: 0.4; }
      }
      .pulse {
        animation: pulse 1.5s infinite ease-in-out;
      }
    </style>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  </head>
  <body>
    <div id="app_skeleton" class="skeleton-loader">
      <div class="skeleton-header">
        <div class="skeleton-title pulse"></div>
        <div class="skeleton-subtitle pulse"></div>
      </div>
      <div class="skeleton-card-container">
        <div class="skeleton-card">
          <div class="skeleton-card-title pulse"></div>
          <div class="skeleton-input pulse"></div>
          <div class="skeleton-input pulse"></div>
          <div class="skeleton-input pulse"></div>
          <div class="skeleton-btn pulse"></div>
        </div>
      </div>
    </div>
    <script>
      {{flutter_bootstrap_js}}
    </script>
  

</body></html>
