name: lyrics_anki_app
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+20260121
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  ankidroid_for_flutter: ^1.0.3
  # envied: ^1.3.1
  archive: ^4.0.7
  file_saver: ^0.3.1
  firebase_ai: ^3.7.0
  firebase_analytics: ^12.1.0
  firebase_app_check: ^0.4.1+4
  firebase_core: ^4.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.4
  http: ^1.6.0
  intl: ">=0.19.0 <0.21.0"
  json_annotation: ^4.8.1
  package_info_plus: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.2
  qr_flutter: ^4.1.0
  retry: ^3.1.2
  riverpod_annotation: ^4.0.0
  shimmer: ^3.0.0
  sqlite3: ^3.3.1
  talker_flutter: ^5.1.17
  talker_riverpod_logger: ^5.1.17
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.10.5
  # envied_generator: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  hive_ce_generator: ^1.10.0
  json_serializable: ^6.11.2
  mocktail: ^1.0.3
  riverpod_generator: ^4.0.0+1
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
    - family: Noto Sans Thai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
    - family: Noto Sans Myanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
    - family: Noto Sans TC
      fonts:
        - asset: assets/fonts/NotoSansTC-Regular.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFF5F7"
  image: "assets/images/app_icon.png"
  android_12:
    image: "assets/images/app_icon.png"
    icon_background_color: "#FFF5F7"
